<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA INICIAL DE BOAS-VINDAS -->
    <div id="tela-inicio" class="container-inicio">
        <div class="card-inicio">
            <h1>Painel Financeiro</h1>
            <p>Gerencie seus gastos, acompanhe seu saldo e faça fechamentos de forma simples.</p>
            <button id="btn-iniciar" class="btn-primary">Iniciar</button>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="painel-principal" class="container-painel hidden">

        <!-- CABEÇALHO -->
        <header class="header-principal">
            <h2>PAINEL FINANCEIRO</h2>
            <div class="header-acoes">
                <button id="btn-salvar-sessao" class="btn-secundario">Salvar</button>
                <button id="btn-sair" class="btn-danger">Sair</button>
            </div>
        </header>

        <!-- MENU DE NAVEGAÇÃO / ABAS -->
        <nav class="nav-abas">
            <button id="btn-nav-lancamento" class="btn-aba active">➕ Novo Lançamento</button>
            <button id="btn-nav-resumo" class="btn-aba">📊 Resumo de Gastos</button>
            <button id="btn-nav-relatorio" class="btn-aba">📋 Fechamentos</button>
        </nav>

        <!-- CARD SUPERIOR: SALDO E VALORES EM BRL -->
        <section class="card-saldo-blue">
            <div class="saldo-linha-input">
                <label for="saldo-inicial">Saldo Inicial (R$):</label>
                <input type="text" id="saldo-inicial" value="0,00" inputmode="numeric">
            </div>
            <div class="saldo-linha-valor">
                <span>Total Gasto:</span>
                <strong id="display-total-gasto">R$ 0,00</strong>
            </div>
            <div class="saldo-linha-valor">
                <span>Saldo Restante:</span>
                <strong id="display-saldo-restante">R$ 0,00</strong>
            </div>
        </section>

        <!-- CONTEÚDO DAS ABAS -->
        <main class="conteudo-abas">

            <!-- ABA 1: NOVO LANÇAMENTO -->
            <section id="tela-lancamento" class="aba-conteudo">
                <h3>Novo Lançamento</h3>
                <form id="form-gasto" class="form-grid">
                    <div class="form-group">
                        <label for="data">Data:</label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="form-group">
                        <label for="descricao">Descrição:</label>
                        <input type="text" id="descricao" placeholder="Ex: Mercado, Combustível" required>
                    </div>
                    <div class="form-group">
                        <label for="valor">Valor (R$):</label>
                        <input type="number" id="valor" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                    <button type="submit" class="btn-primary btn-full">Adicionar Gasto</button>
                </form>
                <p id="status-msg" class="status-mensagem"></p>
            </section>

            <!-- ABA 2: RESUMO DE GASTOS -->
            <section id="tela-resumo" class="aba-conteudo hidden">
                <div class="resumo-header">
                    <h3>Resumo de Gastos do Mês</h3>
                    <button id="btn-fechar-mes" class="btn-warning">Fechar Mês</button>
                </div>

                <div class="tabela-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Descrição</th>
                                <th>Valor</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-body">
                            <!-- Linhas geradas via JavaScript -->
                        </tbody>
                    </table>
                </div>

                <div class="resumo-totalizer">
                    <strong>Total em Aberto: </strong>
                    <span id="resumo-total-gastos">R$ 0,00</span>
                </div>
            </section>

            <!-- ABA 3: HISTÓRICO DE FECHAMENTOS -->
            <section id="tela-relatorio" class="aba-conteudo hidden">
                <h3>Histórico de Fechamentos</h3>
                <div id="container-fechamentos" class="container-fechamentos">
                    <!-- Cards de fechamento gerados via JavaScript -->
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
