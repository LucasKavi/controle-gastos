<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- TELA DE INÍCIO -->
        <div id="tela-inicio" class="card welcome-card">
            <img src="logo.png" alt="Logo" class="logo-inicio">
            <h1>Controle Financeiro</h1>
            <p class="subtitle">Gerencie seus gastos e fechamentos de forma simples</p>
            <button id="btn-iniciar" class="btn-primary btn-lg">Iniciar Painel</button>
        </div>

        <!-- PAINEL PRINCIPAL (Oculto inicialmente) -->
        <div id="painel-principal" class="hidden">

            <!-- HEADER & SESSÃO -->
            <header class="app-header">
                <h2>PAINEL FINANCEIRO</h2>
                <div class="session-actions">
                    <button id="btn-salvar-sessao" class="btn-secondary btn-sm">💾 Salvar</button>
                    <button id="btn-sair" class="btn-danger btn-sm">🚪 Sair</button>
                </div>
            </header>

            <!-- NAVEGAÇÃO / ABAS -->
            <nav class="nav-buttons">
                <button id="btn-nav-lancamento" class="btn-nav active">+ Novo Lançamento</button>
                <button id="btn-nav-resumo" class="btn-nav">📊 Resumo de Gastos</button>
                <button id="btn-nav-relatorio" class="btn-nav">📑 Fechamentos</button>
            </nav>

            <!-- CARD DE SALDO INICIAL E RESUMO RÁPIDO -->
            <div class="card saldo-card">
                <div class="saldo-header">
                    <label for="saldo-inicial">Saldo Inicial (R$):</label>
                    <input type="number" id="saldo-inicial" step="0.01" value="0.00">
                </div>
                <div class="saldo-info">
                    <p><span>Total Gasto:</span> <strong>R$ <span id="display-total-gasto">0.00</span></strong></p>
                    <p><span>Saldo Restante:</span> <strong>R$ <span id="display-saldo-restante">0.00</span></strong></p>
                </div>
            </div>

            <!-- ABA 1: NOVO LANÇAMENTO DE GASTO -->
            <main id="tela-lancamento">
                <div class="card">
                    <h3>Lançar Novo Gasto</h3>
                    <form id="form-gasto">
                        <div class="form-group">
                            <label for="data">Data:</label>
                            <input type="date" id="data" required>
                        </div>
                        <div class="form-group">
                            <label for="descricao">Descrição:</label>
                            <input type="text" id="descricao" placeholder="Ex: Mercado, Combustível..." required>
                        </div>
                        <div class="form-group">
                            <label for="valor">Valor (R$):</label>
                            <input type="number" id="valor" step="0.01" placeholder="0.00" required>
                        </div>
                        <button type="submit" class="btn-primary btn-block">Adicionar Gasto</button>
                    </form>
                    <div id="status-msg" class="status-msg"></div>
                </div>
            </main>

            <!-- ABA 2: RESUMO E TABELA DE GASTOS DO MÊS ATUAL -->
            <section id="tela-resumo" class="hidden">
                <div class="card">
                    <h3>Lançamentos do Mês</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Data</th>
                                    <th>Descrição</th>
                                    <th>Valor</th>
                                    <th>Ação</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-body">
                                <!-- Preenchido dinamicamente pelo JS -->
                            </tbody>
                        </table>
                    </div>

                    <div class="total-box">
                        <strong>Total do Mês: R$ <span id="resumo-total-gastos">0.00</span></strong>
                    </div>

                    <button id="btn-fechar-mes" class="btn-warning btn-block">🔒 Fechar Mês Atual</button>
                </div>
            </section>

            <!-- ABA 3: HISTÓRICO DE FECHAMENTOS -->
            <section id="tela-relatorio" class="hidden">
                <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Histórico de Fechamentos</h3>
                <div id="container-fechamentos">
                    <!-- Cards amarelados de fechamento entram aqui via JS -->
                </div>
            </section>

        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
