<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>

    <!-- Configurações do App/Atalho no Celular -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finanças">
    <meta name="theme-color" content="#1b365d">

    <!-- Ícones do App usando a sua imagem personalizada -->
    <link rel="icon" type="image/png" sizes="512x512" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>PAINEL FINANCEIRO</h2>

        <!-- Navegação (3 Botões) -->
        <div class="nav-buttons">
            <button id="btn-nav-lancamento" class="btn-nav active">➕ Novo Lançamento</button>
            <button id="btn-nav-resumo" class="btn-nav">📊 Resumo de Gastos</button>
            <button id="btn-nav-relatorio" class="btn-nav">📋 Relatório dos Fechamentos</button>
        </div>

        <!-- Card de Saldo Inicial -->
        <div class="card saldo-card">
            <div class="saldo-header">
                <span>Saldo Inicial: R$</span>
                <input type="number" id="saldo-inicial" step="0.01" value="1000.00">
            </div>
            <div class="saldo-info">
                <p><strong>Total Gasto:</strong> R$ <span id="display-total-gasto">0.00</span></p>
                <p><strong>Saldo Restante:</strong> R$ <span id="display-saldo-restante">1000.00</span></p>
            </div>
        </div>

        <!-- TELA 1: Novo Lançamento -->
        <div id="tela-lancamento" class="card">
            <h3>Novo Lançamento</h3>
            <form id="form-gasto">
                <label>Data:</label>
                <input type="date" id="data" required>

                <label>Descrição (Somente texto):</label>
                <input type="text" id="descricao" placeholder="Ex: Uber, Mercado" required pattern="[^0-9]*" title="Não é permitido números">

                <label>Valor (R$):</label>
                <input type="number" step="0.01" id="valor" placeholder="0,00" required>

                <button type="submit" id="btn-salvar">➕ Lançar Gasto</button>
            </form>
            <p id="status-msg"></p>
        </div>

        <!-- TELA 2: Resumo de Gastos -->
        <div id="tela-resumo" class="card hidden">
            <h3>Resumo Detalhado</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Descrição</th>
                            <th>Valor (R$)</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-body">
                        <!-- Linhas inseridas dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
            <div class="total-box">
                <strong>Total Geral de Gastos:</strong> R$ <span id="resumo-total-gastos">0.00</span>
            </div>

            <!-- Botão Fechar Mês -->
            <button id="btn-fechar-mes" class="btn-fechar-mes">🔒 Fechar Mês Atual</button>
        </div>

        <!-- TELA 3: Relatório dos Fechamentos (Estilo Extrato) -->
        <div id="tela-relatorio" class="card hidden">
            <h3>Histórico de Fechamentos</h3>
            <div id="container-fechamentos">
                <!-- Extratos inseridos dinamicamente via JS -->
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
